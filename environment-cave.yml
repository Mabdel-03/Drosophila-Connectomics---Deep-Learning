# Dedicated environment for Stage 5 (Muscular Projection) — live connectome access.
#
# This is the connectome motif-search / CAVE suite's own env, separate from the shared
# `consortium` env and from the stage 1/3 `flyconn` env. It deliberately has NO torch:
# stage 5 only reads/writes parquet + queries CAVE, and flyconn.io imports torch lazily,
# so the connectome/circuit/muscular packages run torch-free.
#
# Build (env lives on the tpoggio GROUP DATA volume — /home inode quota is exhausted and
# personal scratch is over quota; the group volume has ~17B free inodes):
#   bash scripts/setup_cave_env.sh
# or directly:
#   mamba env create -p /orcd/data/tpoggio/001/mabdel03/conda_envs/flyconn_cave -f environment-cave.yml
#   <prefix>/bin/python -m pip install -e . --no-deps
#
# Package versions track the consortium env so parquet/feather written by stages 1-4 read
# back identically (numpy 2.0, pandas 2.3, pyarrow 23, scipy 1.17).
name: flyconn_cave
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy>=1.26,<3
  - pandas>=2.2
  - pyarrow>=14         # feather + parquet (same engine as the offline data)
  - scipy>=1.11
  - networkx>=3.2
  - requests>=2.31
  - tqdm>=4.66
  - pyyaml>=6.0         # campaign spec loader + configs
  - pytest>=7.4
  - pip
  - pip:
      # Live connectome access. These pull their own deep dep trees (cloud-volume,
      # google-auth, etc.) so they are NOT installed --no-deps.
      - caveclient>=5.20
      - navis>=1.8
      - cloud-volume>=8.0
